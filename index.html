<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Video Cutter</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; }
  h1 { font-size: 16px; margin: 0 0 14px; }
  #drop { border: 2px dashed #888; border-radius: 12px; padding: 28px 12px; text-align: center; cursor: pointer; margin-bottom: 16px; word-break: break-all; }
  #drop.over { border-color: #0a84ff; background: rgba(10,132,255,.1); }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] { flex: 1; padding: 7px 9px; font-size: 14px; border-radius: 6px; border: 1px solid #888; }
  button { padding: 7px 14px; font-size: 14px; border-radius: 6px; border: 1px solid #888; cursor: pointer; }
  #go { width: 100%; margin-top: 18px; padding: 10px; background: #0a84ff; color: #fff; border: 0; font-weight: 600; }
  #go:disabled { opacity: .5; cursor: default; }
  .times { display: flex; gap: 12px; } .times > div { flex: 1; }
  .mode { margin-top: 12px; } .mode label { display: block; font-weight: 400; margin: 4px 0; }
  .hint { color: #888; font-size: 12px; margin-top: 2px; }
  progress { width: 100%; margin-top: 14px; display: none; }
  #status { margin-top: 12px; white-space: pre-wrap; }
  .err { color: #ff453a; } .ok { color: #30d158; }
  a { color: #0a84ff; cursor: pointer; }
</style>
</head>
<body>
<h1>Video Cutter</h1>
<div id="drop">Drop a video here<br><span class="hint">or click to choose a file</span></div>

<label>Output folder</label>
<div class="row"><input type="text" id="outDir" readonly placeholder="Choose a folder…"><button id="pick">Choose…</button></div>

<div class="times">
  <div><label>Start</label><input type="text" id="start" value="00:00:00"></div>
  <div><label>End</label><input type="text" id="end" placeholder="00:00:30"></div>
</div>
<div class="hint">Format: HH:MM:SS, MM:SS or seconds (decimals allowed)</div>

<div class="mode">
  <label><input type="radio" name="mode" value="fast" checked> Fast – no re-encode, original quality (start snaps to nearest earlier keyframe)</label>
  <label><input type="radio" name="mode" value="precise"> Precise – re-encode, frame-accurate (slower)</label>
</div>

<button id="go">Cut</button>
<progress id="bar" max="1" value="0"></progress>
<div id="status"></div>

<script>
const $ = (id) => document.getElementById(id);
let input = null;

function setInput(p) {
  input = p;
  $('drop').textContent = p.split('/').pop();
  if (!$('outDir').value) $('outDir').value = p.substring(0, p.lastIndexOf('/'));
  $('status').textContent = '';
}

const drop = $('drop');
drop.addEventListener('click', async () => { const p = await api.chooseFile(); if (p) setInput(p); });
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => {
  const f = e.dataTransfer.files[0];
  if (f) setInput(api.pathForFile(f));
});
// Prevent the window from navigating to a file dropped outside the zone
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());

$('pick').addEventListener('click', async () => { const p = await api.chooseFolder(); if (p) $('outDir').value = p; });

api.onProgress((v) => { $('bar').value = v; });

let busy = false;
$('go').addEventListener('click', async () => {
  if (busy) return api.cancel();
  const status = $('status');
  if (!input) { status.className = 'err'; status.textContent = 'Drop a video first.'; return; }
  busy = true;
  $('go').textContent = 'Cancel';
  $('bar').style.display = 'block'; $('bar').value = 0;
  status.className = ''; status.textContent = 'Cutting…';
  const res = await api.cut({
    input,
    outDir: $('outDir').value,
    start: $('start').value,
    end: $('end').value,
    precise: document.querySelector('input[name=mode]:checked').value === 'precise',
  });
  busy = false;
  $('go').textContent = 'Cut';
  $('bar').style.display = 'none';
  if (res.ok) {
    status.className = 'ok';
    status.innerHTML = '';
    status.append('Saved: ' + res.output + ' ');
    const a = document.createElement('a');
    a.textContent = 'Show in Finder';
    a.onclick = () => api.reveal(res.output);
    status.append(a);
  } else {
    status.className = 'err';
    status.textContent = res.error;
  }
});
</script>
</body>
</html>
